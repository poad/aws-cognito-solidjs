packages:
  - ./app
  - ./infra/cognito

allowBuilds:
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@11.17.0
  - brace-expansion@5.0.8

overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  chokidar: '>=5'
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  semver: '>=7'
  uuid@<14.0.0: '>=14.0.0'

trustPolicy: no-downgrade
